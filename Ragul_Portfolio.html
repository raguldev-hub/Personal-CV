<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ragul K – Software Engineer Portfolio</title>
<meta name="description" content="Portfolio of Ragul K, a computer science student building full-stack and AI-based projects with Java, Spring Boot, Python and React.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3f6fb; --surface:#ffffff; --ink:#10223b; --muted:#53627a;
  --line:#d5deec; --blue:#2754e6; --blue-soft:#e4eaff; --mark:#ffd84d;
  --grid:rgba(16,34,59,.05);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --text:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0e1726; --surface:#16233a; --ink:#eaf0fb; --muted:#9fb0cc;
    --line:#27375a; --blue:#7d9bff; --blue-soft:#1d2f5c; --mark:#ffd84d;
    --grid:rgba(234,240,251,.05);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{
  font-family:var(--text);font-size:1.0625rem;line-height:1.65;color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
}
a{color:var(--blue);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:4px}
.wrap{width:min(1040px,100% - 2.5rem);margin-inline:auto}
